name: Deploy Call Graph to GitHub Pages

# Renders the committed merged probe graph with the probegraph web viewer
# and deploys it to GitHub Pages. The project itself is not built in CI: it
# needs a built sibling secure-messaging checkout (see README), so the graph
# JSON is committed and passed to the reusable workflow as pre-built atoms.

on:
  push:
    branches: [main]
    paths:
      - '.verilib/probes/merged_smimporttest_securemessaging.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  upload-atoms:
    name: Upload merged atoms artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload merged graph as artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-atoms
          path: .verilib/probes/merged_smimporttest_securemessaging.json
          retention-days: 1

  callgraph:
    name: Build viewer and deploy
    needs: upload-atoms
    uses: Beneficial-AI-Foundation/probegraph/.github/workflows/generate-lean-callgraph.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      pre_built_atoms: merged-atoms
      deploy_mode: standalone
